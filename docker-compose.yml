services:
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-modsecurity}
      POSTGRES_USER: ${POSTGRES_USER:-modsecurity}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-modsecurity}
    volumes:
      - ./src/database/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./src/database/seed.sql:/docker-entrypoint-initdb.d/02-seed.sql:ro
    expose:
      - "5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-modsecurity} -d ${POSTGRES_DB:-modsecurity}"]
      interval: 10s
      timeout: 5s
      retries: 5

  demo-app:
    image: node:20-alpine
    working_dir: /app
    command: sh -c "npm install && npm run start"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      APP_PORT: ${APP_PORT:-3000}
      DB_HOST: ${DB_HOST:-postgres}
      DB_PORT: ${DB_PORT:-5432}
      DB_NAME: ${DB_NAME:-modsecurity}
      DB_USER: ${DB_USER:-modsecurity}
      DB_PASSWORD: ${DB_PASSWORD:-modsecurity}
      APP_LOG_FILE: /app/logs/demo-app/application.log
      ELK_ENABLED: ${ELK_ENABLED:-1}
      ELK_PROXY_TOKEN: ${ELK_PROXY_TOKEN:-local-elk-proxy-token}
      ELK_INDEX_PATTERN: ${ELK_INDEX_PATTERN:-modsecurity-demo-*}
      KIBANA_DASHBOARD_URL: ${KIBANA_DASHBOARD_URL:-http://localhost:5601/app/discover}
    volumes:
      - ./:/app
    ports:
      - "${APP_PORT:-3000}:3000"

  waf-gateway:
    image: owasp/modsecurity-crs:4.25-nginx-lts
    user: "0:0"
    depends_on:
      - demo-app
    environment:
      BACKEND: ${BACKEND:-http://demo-app:3000}
      SERVERNAME: localhost
      PORT: 8080
      PROXY_TIMEOUT: ${PROXY_TIMEOUT:-30s}
      PARANOIA: ${PARANOIA:-1}
      BLOCKING_PARANOIA: ${BLOCKING_PARANOIA:-1}
      ANOMALY_INBOUND: ${ANOMALY_INBOUND:-5}
      ANOMALY_OUTBOUND: ${ANOMALY_OUTBOUND:-4}
      REPORTING_LEVEL: ${REPORTING_LEVEL:-2}
      MODSEC_RULE_ENGINE: ${MODSEC_RULE_ENGINE:-On}
      MANUAL_MODE: ${MANUAL_MODE:-0}
      ELK_PROXY_TOKEN: ${ELK_PROXY_TOKEN:-local-elk-proxy-token}
      ACCESSLOG: /var/log/nginx/access.log
      ERRORLOG: /var/log/nginx/error.log
      MODSEC_AUDIT_ENGINE: RelevantOnly
      MODSEC_AUDIT_LOG: /var/log/modsecurity/audit.log
      MODSEC_AUDIT_LOG_FORMAT: JSON
      MODSEC_AUDIT_LOG_TYPE: Serial
    ports:
      - "${DEMO_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD-SHELL", "curl -sS http://localhost:8080/health >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 12
    volumes:
      - ./nginx/conf.d/default.conf.template:/etc/nginx/templates/default.conf.template:ro
      - ./modsecurity/custom/request-900-exclusion-rules-before-crs.conf:/etc/modsecurity.d/owasp-crs/rules/REQUEST-900-EXCLUSION-RULES-BEFORE-CRS.conf:ro
      - ./modsecurity/custom/request-910-app-rules.conf:/etc/modsecurity.d/owasp-crs/rules/REQUEST-910-APP-RULES.conf:ro
      - ./modsecurity/custom/request-920-rate-limit-rules.conf:/etc/modsecurity.d/owasp-crs/rules/REQUEST-920-RATE-LIMIT-RULES.conf:ro
      - ./modsecurity/custom/response-999-exclusion-rules-after-crs.conf:/etc/modsecurity.d/owasp-crs/rules/RESPONSE-999-EXCLUSION-RULES-AFTER-CRS.conf:ro
      - ./logs/nginx:/var/log/nginx
      - ./logs/modsecurity:/var/log/modsecurity

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.17.3
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      ES_JAVA_OPTS: -Xms512m -Xmx512m
    ports:
      - "9200:9200"
    healthcheck:
      test: ["CMD-SHELL", "curl -sS http://localhost:9200 >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 12
    volumes:
      - elasticsearch-data:/usr/share/elasticsearch/data

  kibana:
    image: docker.elastic.co/kibana/kibana:8.17.3
    depends_on:
      - elasticsearch
    environment:
      ELASTICSEARCH_HOSTS: http://elasticsearch:9200
      XPACK_SECURITY_ENABLED: "false"
    ports:
      - "5601:5601"

  filebeat:
    image: docker.elastic.co/beats/filebeat:8.17.3
    user: root
    depends_on:
      elasticsearch:
        condition: service_healthy
      kibana:
        condition: service_started
    command: ["filebeat", "-e", "--strict.perms=false"]
    volumes:
      - ./filebeat/filebeat.yml:/usr/share/filebeat/filebeat.yml:ro
      - ./logs:/workspace/logs:ro

volumes:
  elasticsearch-data:
