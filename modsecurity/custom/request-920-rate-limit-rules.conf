# REQUEST-920-RATE-LIMIT-RULES.conf
# Lightweight IP-based brute-force throttling for /api/login.

SecAction \
  "id:120000,phase:1,pass,nolog,initcol:ip=%{REMOTE_ADDR}"

SecRule REQUEST_URI "@rx ^/api/login/?$" \
  "id:120010,phase:2,pass,log,msg:'App rule: track login attempts by source IP',setvar:ip.login_counter=+1,expirevar:ip.login_counter=60"

SecRule REQUEST_URI "@rx ^/api/login/?$" \
  "id:120020,phase:2,deny,status:429,log,auditlog,msg:'App rule: login rate limit exceeded',chain"
  SecRule IP:login_counter "@gt 20" "t:none"
