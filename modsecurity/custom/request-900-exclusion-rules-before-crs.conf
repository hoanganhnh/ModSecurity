# REQUEST-900-EXCLUSION-RULES-BEFORE-CRS.conf
# Keep exclusions narrow (path + variable + rule id) after measured false positives only.
# Existing exclusion: Supabase auth cookies can trigger false positives on high-entropy token checks.
SecRule REQUEST_URI "@beginsWith /api/" \
  "id:100900,phase:1,pass,nolog,chain"
  SecRule REQUEST_COOKIES_NAMES "@rx ^sb-[a-z0-9]+-auth-token(\.[0-9]+)?$" \
    "t:none,ctl:ruleRemoveById=932260"
