# REQUEST-900-EXCLUSION-RULES-BEFORE-CRS.conf
# Keep exclusions narrow (path + variable + rule id) after measured false positives only.
# Existing exclusion: Supabase auth cookies can trigger false positives on high-entropy token checks.
SecRule REQUEST_URI "@beginsWith /api/" \
  "id:100900,phase:1,pass,nolog,chain,ctl:ruleRemoveById=932260"
  SecRule REQUEST_HEADERS:Cookie "@rx (^|;[[:space:]]*)sb-[a-z0-9]+-auth-token(\.[0-9]+)?=" \
    "t:none"

SecRule REQUEST_URI "@streq /" \
  "id:100901,phase:1,pass,nolog,chain,ctl:ruleRemoveById=932260"
  SecRule REQUEST_HEADERS:Cookie "@rx (^|;[[:space:]]*)sb-[a-z0-9]+-auth-token(\.[0-9]+)?=" \
    "t:none"

SecRule REQUEST_URI "@streq /favicon.ico" \
  "id:100902,phase:1,pass,nolog,chain,ctl:ruleRemoveById=932260"
  SecRule REQUEST_HEADERS:Cookie "@rx (^|;[[:space:]]*)sb-[a-z0-9]+-auth-token(\.[0-9]+)?=" \
    "t:none"
