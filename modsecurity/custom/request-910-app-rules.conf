# REQUEST-910-APP-RULES.conf
# App-specific rules scoped by endpoint and parameter.

SecRule REQUEST_URI "@rx ^/api/login/?$" \
  "id:110010,phase:2,deny,status:403,log,auditlog,msg:'App rule: SQLi pattern in login credentials',chain"
  SecRule ARGS_NAMES|ARGS "@rx (?i)(?:'\s*or\s+1=1|union\s+select|--|/\*|\*/|;\s*drop\s+table)" "t:none"

SecRule REQUEST_URI "@rx ^/api/search/?$" \
  "id:110020,phase:2,deny,status:403,log,auditlog,msg:'App rule: SQLi/XSS pattern in search query',chain"
  SecRule ARGS:q "@rx (?i)(?:'\s*or\s+1=1|union\s+select|<script|javascript:|onerror=)" "t:none"

SecRule REQUEST_URI "@rx ^/api/comment/?$" \
  "id:110030,phase:2,deny,status:403,log,auditlog,msg:'App rule: XSS/SQLi pattern in comment payload',chain"
  SecRule ARGS:content "@rx (?i)(?:<script|javascript:|onerror=|'\s*or\s+1=1|union\s+select)" "t:none"

SecRule REQUEST_URI "@rx ^/api/files/?$" \
  "id:110040,phase:2,deny,status:403,log,auditlog,msg:'App rule: LFI/path traversal in file parameter',chain"
  SecRule ARGS:file "@rx (?i)(?:\.\./|%2e%2e%2f|%2e%2e/|/etc/passwd)" "t:none"

SecRule REQUEST_URI "@rx ^/api/admin/?$" \
  "id:110050,phase:1,deny,status:403,log,auditlog,msg:'App rule: missing admin token header',chain"
  SecRule &REQUEST_HEADERS:x-admin-token "@eq 0" "t:none"

SecRule REQUEST_URI "@rx ^/api/admin/?$" \
  "id:110051,phase:1,deny,status:403,log,auditlog,msg:'App rule: malformed admin token header',chain"
  SecRule REQUEST_HEADERS:x-admin-token "!@rx ^[A-Za-z0-9._-]{8,128}$" "t:none"
